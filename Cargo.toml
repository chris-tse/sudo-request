[workspace]
resolver = "2"
members = ["crates/protocol", "crates/cli", "crates/executor"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sudo-request-protocol = { path = "crates/protocol" }

[profile.release]
strip = true
lto = true
